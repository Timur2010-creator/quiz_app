<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Animated preview of the Quiz App: a question, a timer, and answers turning green and red" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262A63"/>
      <stop offset="1" stop-color="#14162B"/>
    </linearGradient>
  </defs>

  <rect width="720" height="320" rx="24" fill="url(#bg)"/>

  <!-- progress bar -->
  <rect x="60" y="30" width="540" height="8" rx="4" fill="#2A2D4A"/>
  <rect x="60" y="30" width="162" height="8" rx="4" fill="#C44CF2"/>
  <text x="60" y="58" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#A8AAB7">3/10</text>

  <!-- timer ring -->
  <circle cx="650" cy="38" r="16" fill="none" stroke="#2A2D4A" stroke-width="4"/>
  <circle cx="650" cy="38" r="16" fill="none" stroke="#42D9A5" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="100.53" transform="rotate(-90 650 38)">
    <animate attributeName="stroke-dashoffset" values="0;45;45" keyTimes="0;0.4;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- question -->
  <text x="360" y="96" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#C298DF">Geography</text>
  <text x="360" y="126" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">What is the capital of France?</text>

  <!-- A: Berlin -->
  <rect x="60" y="150" width="290" height="56" rx="12" fill="#6875F5">
    <animate attributeName="fill" calcMode="discrete" values="#6875F5;#2A2D4A;#6875F5" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="205" y="184" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
    A &#160; Berlin
    <animate attributeName="fill" calcMode="discrete" values="#FFFFFF;#7C80A6;#FFFFFF" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- B: Paris (correct) -->
  <rect x="370" y="150" width="290" height="56" rx="12" fill="#6875F5">
    <animate attributeName="fill" calcMode="discrete" values="#6875F5;#42D9A5;#6875F5" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="515" y="184" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">B &#160; Paris</text>
  <path d="M626 178 l7 7 l13 -14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- C: Madrid (tapped, wrong) -->
  <rect x="60" y="224" width="290" height="56" rx="12" fill="#6875F5">
    <animate attributeName="fill" calcMode="discrete" values="#6875F5;#FF4B50;#6875F5" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="205" y="258" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">C &#160; Madrid</text>
  <path d="M314 245 l14 14 M328 245 l-14 14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="205" cy="252" r="0" fill="#FFFFFF" opacity="0">
    <animate attributeName="r" values="0;0;24;24" keyTimes="0;0.37;0.45;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0;0.37;0.45;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- D: Rome -->
  <rect x="370" y="224" width="290" height="56" rx="12" fill="#6875F5">
    <animate attributeName="fill" calcMode="discrete" values="#6875F5;#2A2D4A;#6875F5" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="515" y="258" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
    D &#160; Rome
    <animate attributeName="fill" calcMode="discrete" values="#FFFFFF;#7C80A6;#FFFFFF" keyTimes="0;0.4;0.9" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- floating question marks -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" fill="#8F9AFF">
    <text x="24" y="300" font-size="26" opacity="0">?
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -250" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="684" y="300" font-size="30" opacity="0">?
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -250" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="300" font-size="18" opacity="0" fill="#C298DF">?
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -220" dur="5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="676" y="300" font-size="20" opacity="0" fill="#C298DF">?
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -220" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
